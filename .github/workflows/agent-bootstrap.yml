name: Apply agent foundation source
on:
  push:
    branches: [feat/agent-foundations]
    paths: ['.bootstrap/**', '.github/workflows/agent-bootstrap.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'CesarPetrescu/npcraft' && github.ref == 'refs/heads/feat/agent-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and apply the locally prepared Git patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          parts = [Path(f'.bootstrap/agent-{i}.b64').read_text().strip() for i in range(4)]
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8a0fd8cff83a18f45f7db7dbebfea2caae95d386b05a5cf73424bf5240b11176'
          Path(os.environ['RUNNER_TEMP'], 'source.patch').write_bytes(patch)
          PY
          git apply --index --whitespace=error "$RUNNER_TEMP/source.patch"
          python tools/validate.py
          python -m unittest discover -s tests -q
      - name: Commit readable source and remove the one-time transport
        run: |
          git rm -r .bootstrap .github/workflows/agent-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add transactional backpack, goal-driven crafting and safe vertical navigation'
          git push origin HEAD:refs/heads/feat/agent-foundations
