name: Graphical client playtest
on:
  push:
    branches: [feat/client-playtest]
    paths: ['tools/**', 'datapack/**', '.github/workflows/client-playtest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    name: Vanilla GUI, player controls and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri mesa-utils mesa-vulkan-drivers libglfw3 libopenal1
      - name: Exercise the unmodified Minecraft client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' python tools/client_playtest.py --accept-eula
      - name: Publish screenshots, client/server logs and assertions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minecraft-client-playtest
          path: reports/visual/
          if-no-files-found: warn
          retention-days: 14
