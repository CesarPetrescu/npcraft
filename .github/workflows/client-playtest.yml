name: Graphical client playtest
on:
  push:
    branches: [feat/client-playtest]
    paths: ['tools/**', 'datapack/**', '.github/workflows/client-playtest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    name: Vanilla GUI, player controls and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Install graphical test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri mesa-utils mesa-vulkan-drivers libglfw3 libopenal1
      - name: Exercise the unmodified Minecraft client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' python tools/client_playtest.py --accept-eula
      - name: Publish screenshots, client/server logs and assertions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minecraft-client-playtest
          path: reports/visual/
          if-no-files-found: warn
          retention-days: 14
  evidence:
    name: Commit captured evidence to this feature branch
    needs: client
    if: github.event_name == 'push' && github.repository == 'CesarPetrescu/npcraft' && github.ref == 'refs/heads/feat/client-playtest'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minecraft-client-playtest
          path: evidence-input
      - name: Copy only bounded PNG evidence and the successful JSON report
        run: |
          python - <<'PY'
          import json, pathlib, re, shutil
          source = pathlib.Path('evidence-input')
          report = json.loads((source / 'visual-results.json').read_text())
          if report.get('success') is not True:
              raise SystemExit('Refusing to publish a failed graphical test')
          destination = pathlib.Path('docs/screenshots')
          destination.mkdir(parents=True, exist_ok=True)
          images = sorted((source / 'screenshots').glob('*.png'))
          if not 1 <= len(images) <= 12:
              raise SystemExit('Unexpected screenshot count')
          for path in images:
              if path.is_symlink() or not re.fullmatch(r'[0-9]{2}-[a-z0-9-]+\.png', path.name):
                  raise SystemExit('Unsafe screenshot path')
              data = path.read_bytes()
              if len(data) > 3000000 or not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('Unexpected screenshot bytes')
              (destination / path.name).write_bytes(data)
          shutil.copyfile(source / 'visual-results.json', destination / 'visual-results.json')
          PY
      - name: Commit evidence without rewriting branch history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: record genuine Minecraft client screenshots and playtest evidence'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/client-playtest
